<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strongman AI – Redirecting…</title>
    <meta http-equiv="refresh" content="0;url=/create#stats">
    <script>
        (function () {
            var hash = location.hash;
            if (!hash || hash === '#') hash = '#stats';
            location.replace('/create' + hash);
        })();
    </script>
</head>
<body>
    <p>Moved to <a href="/create#stats">Log &amp; progress</a>.</p>
</body>
</html>
