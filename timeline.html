<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ff4d0d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="strongman-api-base" content="https://strongmanai-api.onrender.com/api/v1">
    <title>Strongman AI – Timeline</title>
    <link rel="icon" type="image/png" href="/assets/logo.png">
    <link rel="apple-touch-icon" href="/assets/app-icon-180.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
    <script src="/shared/theme.js"></script>
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/app-nav.css">
    <link rel="stylesheet" href="/css/notification-bell.css">
    <link rel="stylesheet" href="/css/settings-app.css">
    <link rel="stylesheet" href="/css/settings-buddy.css">
    <link rel="stylesheet" href="/css/info.css">
    <link rel="stylesheet" href="/css/timeline.css">
    <link rel="stylesheet" href="/css/server-wake.css">
</head>
<body class="info-page timeline-page" data-current-page="timeline">
    <aside class="site-sidebar" id="site-sidebar" aria-label="Main navigation">
        <div class="sidebar-brand">
            <span class="sidebar-logo">STRONGMAN <span class="sidebar-logo-ai">AI</span></span>
        </div>
        <nav class="sidebar-nav" aria-label="App sections"></nav>
        <div class="sidebar-bottom">
            <div class="sidebar-profile-wrap">
                <button type="button" class="sidebar-profile sidebar-profile-trigger" id="sidebar-profile-trigger" aria-label="Profile menu" aria-expanded="false" aria-haspopup="true" aria-controls="sidebar-profile-menu">
                    <span class="sidebar-profile-avatar" aria-hidden="true"></span>
                    <span class="sidebar-label">Profile</span>
                </button>
                <div class="sidebar-profile-menu" id="sidebar-profile-menu" role="menu" aria-hidden="true" hidden>
                    <a href="/profile" class="sidebar-profile-menu-item" role="menuitem">View profile</a>
                </div>
            </div>
            <button type="button" class="sidebar-link sidebar-link-more sidebar-settings-trigger" id="sidebar-settings-trigger" aria-label="Settings" aria-haspopup="dialog" aria-expanded="false" aria-controls="home-settings-dialog">
                <span class="sidebar-label">Settings</span>
            </button>
        </div>
    </aside>
    <div class="main-wrap">
        <main class="info-main timeline-main">
            <header class="info-hero">
                <p class="info-eyebrow">Training log</p>
                <h1 class="info-title">Timeline</h1>
                <p class="info-lead">Workouts, injuries, equipment changes, and life updates in one place — some entries also update your settings for Rocky.</p>
            </header>
            <section class="timeline-section" aria-label="Editable training timeline">
                <div class="dash-timeline-root" id="timeline-root"></div>
            </section>
        </main>
    </div>

    <div class="home-settings-backdrop" id="home-settings-backdrop" aria-hidden="true"></div>
    <div class="home-settings-dialog settings-buddy settings-hub" id="home-settings-dialog" role="dialog" aria-modal="true" aria-labelledby="home-settings-title" aria-hidden="true">
        <div class="home-settings-panel">
            <header class="home-settings-header">
                <div class="settings-hub-brand">
                    <span class="settings-hub-mark" aria-hidden="true">SM</span>
                    <div class="settings-hub-brand-text">
                        <span class="settings-hub-eyebrow">Strongman AI</span>
                        <span class="settings-hub-title-text">Settings</span>
                    </div>
                </div>
                <h2 class="home-settings-title visually-hidden" id="home-settings-title">Settings</h2>
                <button type="button" class="home-settings-close" id="home-settings-close" aria-label="Close settings">×</button>
            </header>
            <div class="home-settings-body">
                <p class="settings-hub-intro">Theme and preferences. Your timeline stays on this page.</p>
                <section class="home-settings-section settings-buddy-card" aria-labelledby="settings-appearance-heading">
                    <h3 class="home-settings-section-title" id="settings-appearance-heading">Appearance</h3>
                    <div class="home-settings-theme-row settings-theme-pills" role="group" aria-label="Color theme">
                        <label class="settings-theme-pill"><input type="radio" name="home-theme" value="dark" class="home-settings-radio"> Ember</label>
                        <label class="settings-theme-pill"><input type="radio" name="home-theme" value="light" class="home-settings-radio"> Daylight</label>
                        <label class="settings-theme-pill"><input type="radio" name="home-theme" value="system" class="home-settings-radio"> System</label>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script src="/shared/api.js"></script>
    <script src="/shared/notification-bell.js"></script>
    <script src="/shared/server-wake.js"></script>
    <script src="/shared/user-avatar.js"></script>
    <script src="/shared/app-nav.js"></script>
    <script src="/shared/sidebar-profile-menu.js"></script>
    <script src="/shared/auth-guard.js"></script>
    <script src="/shared/offline-db.js"></script>
    <script src="/shared/workout-log.js"></script>
    <script src="/shared/training-sync.js"></script>
    <script src="/shared/coach-memory.js"></script>
    <script src="/shared/training-timeline.js"></script>
    <script src="/shared/settings-popup.js"></script>
    <script src="/shared/push-client.js"></script>
    <script src="/js/timeline.js"></script>
</body>
</html>
