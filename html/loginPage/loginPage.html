<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="strongman-api-base" content="https://strongmanai-api.onrender.com/api/v1">
    <title>Sign in – Strongman AI</title>
    <link rel="icon" type="image/png" href="../../assets/logo.png">
    <link rel="apple-touch-icon" href="../../assets/logo.png">
    <link rel="stylesheet" href="../../css/loginPage/loginPage.css">
</head>
<body class="auth-page">
    <div class="auth-ambient" aria-hidden="true">
        <span class="auth-ambient-orb auth-ambient-orb--a"></span>
        <span class="auth-ambient-orb auth-ambient-orb--b"></span>
    </div>
    <div class="login-logo">
        <img src="../../assets/logo.png" alt="" class="login-logo-img" decoding="async">
        <span class="login-logo-wordmark">STRONGMAN <span class="login-logo-accent">AI</span></span>
    </div>

    <main class="auth-main">
        <div class="auth-card">
            <div class="auth-card-accent" aria-hidden="true"></div>
            <div class="auth-card-brand">
                <img src="../../assets/logo.png" alt="" class="auth-card-logo" width="48" height="48" decoding="async">
                <p class="auth-card-tagline">Train smarter. Track everything.</p>
            </div>

            <nav class="auth-tabs" role="tablist" aria-label="Account access">
                <button type="button" class="auth-tab" role="tab" id="auth-tab-login" aria-selected="true" aria-controls="auth-panel-login">Sign in</button>
                <button type="button" class="auth-tab" role="tab" id="auth-tab-signup" aria-selected="false" aria-controls="auth-panel-signup">Create account</button>
            </nav>

            <div class="auth-panels-viewport">
                <div class="auth-panels-track" id="auth-panels-track" data-panel="login">
                    <section class="auth-panel" id="auth-panel-login" role="tabpanel" aria-labelledby="auth-tab-login" aria-hidden="false">
                        <h1 class="auth-panel-title">Welcome back</h1>
                        <p class="auth-panel-desc">Use your email or switch to username below.</p>
                        <form class="auth-form login-form" id="login-form" autocomplete="on">
                            <div class="login-input-group">
                                <input type="email" id="credential" class="login-input" required placeholder=" " autocomplete="email">
                                <label for="credential" class="login-label" id="credential-label">Email</label>
                            </div>
                            <div class="login-input-group">
                                <input type="password" id="login-password" class="login-input" required placeholder=" " autocomplete="current-password">
                                <label for="login-password" class="login-label">Password</label>
                            </div>
                            <button type="button" class="login-toggle-btn" id="login-toggle-btn">Use username instead</button>
                            <p class="login-error" id="login-error" role="alert" hidden></p>
                            <button class="login-btn" type="submit">Sign in</button>
                        </form>
                    </section>

                    <section class="auth-panel" id="auth-panel-signup" role="tabpanel" aria-labelledby="auth-tab-signup" aria-hidden="true">
                        <h1 class="auth-panel-title">Create your account</h1>
                        <p class="auth-panel-desc">One password, endless sessions. You’ll set up your profile next.</p>
                        <form class="auth-form signup-form" id="signup-form" autocomplete="on">
                            <div class="login-input-group">
                                <input type="email" id="signup-email" class="login-input" required placeholder=" " autocomplete="email">
                                <label for="signup-email" class="login-label">Email</label>
                            </div>
                            <div class="login-input-group">
                                <input type="password" id="signup-password" class="login-input" required placeholder=" " autocomplete="new-password">
                                <label for="signup-password" class="login-label">Password</label>
                            </div>
                            <div class="login-input-group">
                                <input type="password" id="signup-confirm" class="login-input" required placeholder=" " autocomplete="new-password">
                                <label for="signup-confirm" class="login-label">Confirm password</label>
                            </div>
                            <p class="login-error" id="signup-error" role="alert" hidden></p>
                            <button class="login-btn login-btn--signup" type="submit">Create account</button>
                        </form>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <script src="../../shared/api.js"></script>
    <script src="../../javascript/loginPage/loginPage.js"></script>
</body>
</html>
